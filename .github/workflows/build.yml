# Builds the downloadable app for Windows, macOS and Linux.
# A tag "v*", or a manual run with a version (Actions → Build apps → Run workflow), publishes the three archives
# as a GitHub release; other runs keep them as workflow artifacts. A manual run with "replace" first deletes a release
# of that version and its tag, so the version is published again from the commit being built.
name: Build apps

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["app.py", "desktop.py", "updater.py", "VERSION", "launch.py", "server.py", "requirements.txt", "packaging/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a release, e.g. v1.0.0 (empty: build only)"
        required: false
        default: ""
      replace:
        description: "Replace an existing release of this version (deletes it and its tag first)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # only when publishing: the version matches VERSION, then the release exists (replaced if asked) before the builds
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        # a release must carry the version written in VERSION: the app compares it with the releases to offer updates
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$TAG" || { echo "VERSION is $(cat VERSION), the release is $TAG"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ "$REPLACE" = "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Report Sniffer $TAG" --generate-notes

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}          # also when release is skipped (not publishing)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, bin: "dist/ReportSniffer/ReportSniffer.exe" }
          - { os: macos-latest, name: macos-arm64, bin: "dist/Report Sniffer.app/Contents/MacOS/ReportSniffer" }
          - { os: ubuntu-24.04, name: linux-x64, bin: "dist/ReportSniffer/ReportSniffer" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/report_sniffer.spec
      - name: Check that the app starts
        env:
          SNIFFER_PORT: "8791"
        run: |
          "${{ matrix.bin }}" --selftest
          "${{ matrix.bin }}" --no-window &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8791/api/status >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8791/ | grep -q "Report Sniffer"
          curl -fs http://127.0.0.1:8791/static/sniffer.js >/dev/null
          curl -fs -X POST -H "Content-Type: application/json" -d "{}" http://127.0.0.1:8791/api/quit
      - name: Show the app log
        if: always()
        run: cat ~/.report-sniffer/app.log || true
      - name: Archive
        run: |
          cd dist
          case "${{ matrix.name }}" in
            windows-*) 7z a -bso0 "../ReportSniffer-${{ matrix.name }}.zip" ReportSniffer ;;
            macos-*) ditto -c -k --keepParent "Report Sniffer.app" "../ReportSniffer-${{ matrix.name }}.zip" ;;
            linux-*) tar -czf "../ReportSniffer-${{ matrix.name }}.tar.gz" ReportSniffer ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ReportSniffer-${{ matrix.name }}
          path: ReportSniffer-${{ matrix.name }}.*
          if-no-files-found: error
      - name: Publish on the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: gh release upload "$TAG" ReportSniffer-${{ matrix.name }}.* --clobber
